# WhatsApp Engine - Production Docker Compose
#
# Simplified production environment

version: '3.8'

services:
  whatsapp-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.production
    container_name: whatsapp-engine-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ENVIRONMENT=production
      - RUST_LOG=warn
      - WHATSAPP__SERVER__HOST=0.0.0.0
      - WHATSAPP__SERVER__PORT=3000
      - WHATSAPP__AUTH__API_TOKEN=${WHATSAPP_API_TOKEN:-your-secure-production-token}
      - WHATSAPP__BROWSER__HEADLESS=true
      - HEALTH_CHECK_INTERVAL=30
    volumes:
      - whatsapp_data:/app/data
      - /dev/shm:/dev/shm
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Reverse proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: whatsapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-engine

volumes:
  whatsapp_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
