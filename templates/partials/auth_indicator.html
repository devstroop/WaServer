<!-- Auth Indicator (Header) -->
{% if authenticated %}
<span class="status-indicator status-connected">
    <i class="bi bi-check-circle-fill icon-sm"></i>
    Connected
</span>
{% else %}
<a href="/auth" class="status-indicator status-disconnected text-decoration-none">
    <i class="bi bi-exclamation-circle-fill icon-sm"></i>
    Not Linked
</a>
{% endif %}
