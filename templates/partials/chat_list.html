<!-- Chat List Partial -->
{% if !chats.is_empty() %}
<div class="list-group list-group-flush">
    {% for chat in chats %}
    <button 
        class="list-group-item list-group-item-action d-flex align-items-center gap-3 p-3 border-0 border-bottom"
        data-chat-item
        data-chat-id="{{ chat.id }}"
        onclick="selectChat('{{ chat.id }}', '{{ chat.name }}')"
    >
        <div class="rounded-circle bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 48px; height: 48px;">
            {% if chat.is_group %}
            <i class="bi bi-people icon-xl text-secondary"></i>
            {% else %}
            <i class="bi bi-person icon-xl text-secondary"></i>
            {% endif %}
        </div>
        <div class="flex-grow-1 min-w-0">
            <div class="d-flex align-items-center justify-content-between gap-2">
                <span class="fw-medium text-truncate">{{ chat.name }}</span>
                {% match chat.last_message_time %}
                    {% when Some with (time) %}
                    <span class="small text-secondary flex-shrink-0">{{ time }}</span>
                    {% when None %}
                {% endmatch %}
            </div>
            {% match chat.last_message %}
                {% when Some with (msg) %}
                <p class="small text-secondary text-truncate mb-0">{{ msg }}</p>
                {% when None %}
            {% endmatch %}
        </div>
        {% if chat.unread_count > 0 %}
        <span class="badge rounded-pill" style="background-color: var(--was-green);">
            {{ chat.unread_count }}
        </span>
        {% endif %}
    </button>
    {% endfor %}
</div>
{% else %}
<div class="d-flex flex-column align-items-center justify-content-center text-secondary" style="height: 256px;">
    <i class="bi bi-inbox icon-3xl mb-3 opacity-50"></i>
    <p class="small">No chats found</p>
</div>
{% endif %}
