<!-- QR Code Partial -->
{% match qrcode %}
    {% when Some with (qr) %}
    <div class="bg-white p-2 rounded-lg shadow-sm">
        <img 
            src="data:image/png;base64,{{ qr }}"
            alt="WhatsApp QR Code"
            width="200"
            height="200"
            class="rounded"
            style="image-rendering: pixelated;"
        >
    </div>
    {% when None %}
    {% match error %}
        {% when Some with (err) %}
        <div class="flex flex-col items-center justify-center rounded-lg gap-2" style="width:200px;height:200px;background-color:var(--color-background-muted)">
            <p class="text-xs text-destructive text-center px-2">{{ err }}</p>
            <button 
                class="btn btn-outline btn-sm"
                hx-get="/partials/qr-code"
                hx-target="#qr-code-container"
                hx-swap="innerHTML transition:false"
            >
                <i class="bi bi-arrow-clockwise mr-1"></i>
                Retry
            </button>
        </div>
        {% when None %}
        <div class="flex items-center justify-center rounded-lg" style="width:200px;height:200px;background-color:var(--color-background-muted)">
            <p class="text-xs text-muted-foreground">No QR code available</p>
        </div>
    {% endmatch %}
{% endmatch %}
