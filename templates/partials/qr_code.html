<!-- QR Code Partial -->
{% match qrcode %}
    {% when Some with (qr) %}
    <div class="bg-white p-2 rounded-lg shadow-sm">
        <img 
            src="data:image/png;base64,{{ qr }}"
            alt="WhatsApp QR Code"
            width="256"
            height="256"
            class="rounded"
        >
    </div>
    {% when None %}
    {% match error %}
        {% when Some with (err) %}
        <div class="w-64 h-64 flex flex-col items-center justify-center bg-muted rounded-lg gap-2">
            <p class="text-sm text-destructive">{{ err }}</p>
            <button 
                class="btn btn-outline btn-sm"
                hx-get="/partials/qr-code"
                hx-target="#qr-code-container"
                hx-swap="innerHTML"
            >
                <i data-lucide="refresh-cw" class="h-4 w-4 mr-2"></i>
                Retry
            </button>
        </div>
        {% when None %}
        <div class="w-64 h-64 flex items-center justify-center bg-muted rounded-lg">
            <p class="text-sm text-muted-foreground">No QR code available</p>
        </div>
    {% endmatch %}
{% endmatch %}
