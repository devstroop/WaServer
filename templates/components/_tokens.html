<style>
/* ===========================================
   DESIGN TOKENS
   Core variables for the entire design system
   =========================================== */

:root {
    /* ─────────────────────────────────────────
       COLOR PALETTE
       Exact WhatsApp Web colors
       ───────────────────────────────────────── */
    
    /* WhatsApp Brand Green */
    --color-brand: #00a884;
    --color-brand-hover: #008f72;
    --color-brand-active: #017561;
    --color-brand-muted: rgba(0, 168, 132, 0.1);
    --color-brand-strong: #25D366;
    
    /* Teal (Header/Accent) */
    --color-accent: #008069;
    --color-accent-hover: #006a56;
    --color-accent-muted: rgba(0, 128, 105, 0.1);
    
    /* WhatsApp Light Theme Backgrounds */
    --color-background: #ffffff;
    --color-background-subtle: #f0f2f5;
    --color-background-muted: #f0f2f5;
    --color-background-emphasized: #e9edef;
    --color-background-chat: #efeae2;
    --color-background-panel: #ffffff;
    
    /* Message Bubbles */
    --color-bubble-outgoing: #d9fdd3;
    --color-bubble-incoming: #ffffff;
    
    /* WhatsApp Foregrounds */
    --color-foreground: #111b21;
    --color-foreground-muted: #667781;
    --color-foreground-subtle: #8696a0;
    
    /* Borders - WhatsApp uses very subtle borders */
    --color-border: rgba(134, 150, 160, 0.15);
    --color-border-hover: rgba(134, 150, 160, 0.3);
    --color-border-focus: var(--color-brand);
    --color-border-strong: #d1d7db;
    
    /* Semantic - WhatsApp style */
    --color-success: #00a884;
    --color-success-muted: rgba(0, 168, 132, 0.1);
    --color-warning: #ffc107;
    --color-warning-muted: rgba(255, 193, 7, 0.15);
    --color-danger: #ea0038;
    --color-danger-muted: rgba(234, 0, 56, 0.1);
    --color-info: #53bdeb;
    --color-info-muted: rgba(83, 189, 235, 0.15);
    --color-link: #027eb5;
    
    /* System/Info Message (from article) */
    --color-info-message: rgba(225, 245, 254, 0.92);
    --color-encrypted-message: #ffecb3;
    
    /* ─────────────────────────────────────────
       TYPOGRAPHY
       ───────────────────────────────────────── */
    --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-family-mono: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Monaco, Consolas, monospace;
    
    --font-size-xs: 0.75rem;    /* 12px */
    --font-size-sm: 0.8125rem;  /* 13px */
    --font-size-base: 0.875rem; /* 14px */
    --font-size-md: 1rem;       /* 16px */
    --font-size-lg: 1.125rem;   /* 18px */
    --font-size-xl: 1.25rem;    /* 20px */
    --font-size-2xl: 1.5rem;    /* 24px */
    --font-size-3xl: 1.875rem;  /* 30px */
    
    --font-weight-normal: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;
    
    --line-height-tight: 1.25;
    --line-height-normal: 1.5;
    --line-height-relaxed: 1.75;
    
    /* ─────────────────────────────────────────
       SPACING
       Based on 4px grid
       ───────────────────────────────────────── */
    --space-0: 0;
    --space-px: 1px;
    --space-0-5: 0.125rem;  /* 2px */
    --space-1: 0.25rem;     /* 4px */
    --space-1-5: 0.375rem;  /* 6px */
    --space-2: 0.5rem;      /* 8px */
    --space-2-5: 0.625rem;  /* 10px */
    --space-3: 0.75rem;     /* 12px */
    --space-3-5: 0.875rem;  /* 14px */
    --space-4: 1rem;        /* 16px */
    --space-5: 1.25rem;     /* 20px */
    --space-6: 1.5rem;      /* 24px */
    --space-7: 1.75rem;     /* 28px */
    --space-8: 2rem;        /* 32px */
    --space-9: 2.25rem;     /* 36px */
    --space-10: 2.5rem;     /* 40px */
    --space-12: 3rem;       /* 48px */
    --space-16: 4rem;       /* 64px */
    
    /* ─────────────────────────────────────────
       SIZING
       ───────────────────────────────────────── */
    --size-xs: 1.5rem;   /* 24px */
    --size-sm: 2rem;     /* 32px */
    --size-md: 2.5rem;   /* 40px */
    --size-lg: 3rem;     /* 48px */
    --size-xl: 3.5rem;   /* 56px */
    
    /* ─────────────────────────────────────────
       BORDER RADIUS
       ───────────────────────────────────────── */
    --radius-none: 0;
    --radius-sm: 0.25rem;   /* 4px */
    --radius-md: 0.375rem;  /* 6px */
    --radius-lg: 0.5rem;    /* 8px */
    --radius-xl: 0.75rem;   /* 12px */
    --radius-2xl: 1rem;     /* 16px */
    --radius-full: 9999px;
    
    /* ─────────────────────────────────────────
       SHADOWS
       ───────────────────────────────────────── */
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    --shadow-focus: 0 0 0 2px var(--color-brand-muted);
    --shadow-focus-danger: 0 0 0 2px var(--color-danger-muted);
    
    /* ─────────────────────────────────────────
       TRANSITIONS
       ───────────────────────────────────────── */
    --duration-instant: 50ms;
    --duration-fast: 100ms;
    --duration-normal: 150ms;
    --duration-slow: 200ms;
    --duration-slower: 300ms;
    
    --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
    
    /* ─────────────────────────────────────────
       Z-INDEX
       ───────────────────────────────────────── */
    --z-hide: -1;
    --z-base: 0;
    --z-dropdown: 100;
    --z-sticky: 200;
    --z-overlay: 300;
    --z-modal: 400;
    --z-popover: 500;
    --z-toast: 600;
    --z-tooltip: 700;
}

/* ─────────────────────────────────────────
   DARK MODE - Exact WhatsApp Dark Theme
   ───────────────────────────────────────── */
[data-bs-theme="dark"] {
    /* WhatsApp Dark Backgrounds */
    --color-background: #111b21;
    --color-background-subtle: #202c33;
    --color-background-muted: #202c33;
    --color-background-emphasized: #2a3942;
    --color-background-chat: #0b141a;
    --color-background-panel: #111b21;
    
    /* Dark Message Bubbles */
    --color-bubble-outgoing: #005c4b;
    --color-bubble-incoming: #202c33;
    
    /* Dark Foregrounds */
    --color-foreground: #e9edef;
    --color-foreground-muted: #8696a0;
    --color-foreground-subtle: #667781;
    
    /* Dark Borders */
    --color-border: rgba(134, 150, 160, 0.15);
    --color-border-hover: rgba(134, 150, 160, 0.25);
    --color-border-strong: #3b4a54;
    
    /* Dark Shadows */
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
    
    /* Links in dark mode */
    --color-link: #53bdeb;
    
    /* Dark mode info messages */
    --color-info-message: rgba(32, 44, 51, 0.95);
    --color-encrypted-message: rgba(255, 236, 179, 0.15);
}

   =========================================== */

.flex-1 { flex: 1 1 0%; }
.flex-auto { flex: 1 1 auto; }

/* --- Spacing (Margin/Padding) --- */

.p-1 { padding: var(--space-1); }
.p-2 { padding: var(--space-2); }
.p-3 { padding: var(--space-3); }
.p-4 { padding: var(--space-4); }

.px-1 { padding-left: var(--space-1); padding-right: var(--space-1); }

.py-1 { padding-top: var(--space-1); padding-bottom: var(--space-1); }
.py-2 { padding-top: var(--space-2); padding-bottom: var(--space-2); }
.py-3 { padding-top: var(--space-3); padding-bottom: var(--space-3); }

.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }

.mr-2 { margin-right: var(--space-2); }

.space-y-1 > * + * { margin-top: var(--space-1); }
.space-y-2 > * + * { margin-top: var(--space-2); }
.space-y-3 > * + * { margin-top: var(--space-3); }

.space-x-2 > * + * { margin-left: var(--space-2); }

.icon-xs { font-size: 0.75rem; }      /* 12px */
.icon-sm { font-size: 0.875rem; }     /* 14px */

/* --- Text Colors --- */
.text-foreground { color: var(--color-foreground); }

.text-brand { color: var(--color-brand); }
.text-whatsapp { color: var(--color-brand); }
.text-success { color: var(--color-success); }
.text-danger { color: var(--color-danger); }
.text-destructive { color: var(--color-danger); }
.text-warning { color: var(--color-warning); }
.text-info { color: var(--color-info); }
.text-blue-500 { color: #3b82f6; }
.text-yellow-600 { color: #ca8a04; }
[data-bs-theme="dark"] .dark\:text-yellow-400 { color: #facc15; }

/* --- Background Colors --- */
.bg-background { background-color: var(--color-background); }
.bg-muted { background-color: var(--color-background-muted); }
.bg-muted\/50 { background-color: rgba(240, 242, 245, 0.5); }
[data-bs-theme="dark"] .bg-muted\/50 { background-color: rgba(32, 44, 51, 0.5); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-lg { border-radius: var(--radius-lg); }

/* --- Z-Index --- */

/* --- Overflow --- */

.overflow-auto { overflow: auto; }

/* --- Transforms --- */

}

}

}

}

.u-scroll::-webkit-scrollbar-track {

}

.u-scroll::-webkit-scrollbar-thumb {
    background-color: rgba(134, 150, 160, 0.3);

}

.u-scroll::-webkit-scrollbar-thumb:hover {

}
