{#
  Code Component
  
  Parts: code (inline), code-block (block), copy-button
  
  Usage:
    {% include "components/code.html" %}
    
    HTML (inline):
    <code class="code">Bearer token</code>
    
    HTML (block with copy):
    <div class="code-block">
      <div class="code-header">
        <span class="code-lang">bash</span>
        <button class="code-copy" onclick="copyCode(this)">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
      <pre class="code-pre"><code>curl -X GET https://api.example.com</code></pre>
    </div>
#}
<style>
/* ===========================================
   CODE COMPONENT
   =========================================== */

/* ─────────────────────────────────────────
   INLINE CODE
   ───────────────────────────────────────── */

.code,
code:not(.code-pre code) {
    display: inline;
    padding: var(--space-0-5) var(--space-1-5);
    font-family: var(--font-family-mono);
    font-size: 0.875em;
    font-weight: var(--font-weight-normal);
    line-height: inherit;
    background-color: var(--color-background-muted);
    border-radius: var(--radius-sm);
    color: var(--color-foreground);
    word-break: break-word;
}

[data-bs-theme="dark"] .code,
[data-bs-theme="dark"] code:not(.code-pre code) {
    background-color: var(--color-background-emphasized);
}

/* ─────────────────────────────────────────
   CODE BLOCK
   ───────────────────────────────────────── */

.code-block {
    position: relative;
    background-color: var(--color-background-muted);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

[data-bs-theme="dark"] .code-block {
    background-color: var(--color-background-emphasized);
}

.code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2) var(--space-4);
    background-color: rgba(0, 0, 0, 0.03);
    border-bottom: 1px solid var(--color-border);
}

[data-bs-theme="dark"] .code-header {
    background-color: rgba(255, 255, 255, 0.03);
}

.code-lang {
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.code-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--size-sm);
    height: var(--size-sm);
    padding: 0;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--color-foreground-muted);
    cursor: pointer;
    transition: color var(--duration-fast), background-color var(--duration-fast);
}

.code-copy:hover {
    color: var(--color-foreground);
    background-color: rgba(0, 0, 0, 0.05);
}

[data-bs-theme="dark"] .code-copy:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

.code-copy.copied {
    color: var(--color-success);
}

.code-pre {
    margin: 0;
    padding: var(--space-4);
    overflow-x: auto;
    font-family: var(--font-family-mono);
    font-size: var(--font-size-sm);
    line-height: var(--line-height-relaxed);
    background: transparent;
}

.code-pre code {
    background: transparent;
    padding: 0;
    font-size: inherit;
    color: inherit;
}

/* Code block without header */
.code-block-simple {
    padding: var(--space-4);
}

.code-block-simple .code-pre {
    padding: 0;
}

/* ─────────────────────────────────────────
   CODE BLOCK SIZES
   ───────────────────────────────────────── */

.code-block-sm .code-header {
    padding: var(--space-1-5) var(--space-3);
}

.code-block-sm .code-pre {
    padding: var(--space-3);
    font-size: var(--font-size-xs);
}

/* ─────────────────────────────────────────
   COPYABLE CODE (inline with copy button)
   ───────────────────────────────────────── */

.code-copyable {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-1) var(--space-2) var(--space-1) var(--space-3);
    background-color: var(--color-background-muted);
    border-radius: var(--radius-md);
    font-family: var(--font-family-mono);
    font-size: var(--font-size-sm);
}

.code-copyable-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.code-copyable .code-copy {
    flex-shrink: 0;
}
</style>

<script>
/* Copy code to clipboard */
function copyCode(button) {
    const codeBlock = button.closest('.code-block');
    const codeElement = codeBlock ? codeBlock.querySelector('code') : null;
    
    if (codeElement) {
        navigator.clipboard.writeText(codeElement.textContent.trim()).then(() => {
            button.classList.add('copied');
            const icon = button.querySelector('i');
            if (icon) {
                icon.classList.remove('bi-clipboard');
                icon.classList.add('bi-check');
            }
            
            setTimeout(() => {
                button.classList.remove('copied');
                if (icon) {
                    icon.classList.remove('bi-check');
                    icon.classList.add('bi-clipboard');
                }
            }, 2000);
        });
    }
}

/* Copy from copyable code element */
function copyCopyable(button) {
    const container = button.closest('.code-copyable');
    const textElement = container ? container.querySelector('.code-copyable-text') : null;
    
    if (textElement) {
        navigator.clipboard.writeText(textElement.textContent.trim()).then(() => {
            button.classList.add('copied');
            const icon = button.querySelector('i');
            if (icon) {
                icon.classList.remove('bi-clipboard');
                icon.classList.add('bi-check');
            }
            
            setTimeout(() => {
                button.classList.remove('copied');
                if (icon) {
                    icon.classList.remove('bi-check');
                    icon.classList.add('bi-clipboard');
                }
            }, 2000);
        });
    }
}
</script>
