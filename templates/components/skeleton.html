{#
  Skeleton/Loading Component
  
  Usage:
    {% include "components/skeleton.html" %}
    
    HTML:
    <div class="skeleton skeleton-text"></div>
    <div class="skeleton skeleton-avatar"></div>
    <div class="skeleton skeleton-card"></div>
#}
<style>
/* ===========================================
   SKELETON/LOADING COMPONENT
   =========================================== */

/* Base Skeleton */
.skeleton {
    background: linear-gradient(
        90deg,
        var(--color-background-muted) 25%,
        var(--color-background-emphasized) 50%,
        var(--color-background-muted) 75%
    );
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.5s ease-in-out infinite;
    border-radius: var(--radius-md);
}

@keyframes skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ─────────────────────────────────────────
   SKELETON VARIANTS
   ───────────────────────────────────────── */

/* Text line */
.skeleton-text {
    height: 1rem;
    width: 100%;
}

.skeleton-text-sm {
    height: 0.75rem;
}

.skeleton-text-lg {
    height: 1.25rem;
}

/* Title */
.skeleton-title {
    height: 1.5rem;
    width: 60%;
}

/* Paragraph (multiple lines) */
.skeleton-paragraph {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
}

.skeleton-paragraph .skeleton-text:last-child {
    width: 80%;
}

/* Avatar */
.skeleton-avatar {
    width: var(--size-md);
    height: var(--size-md);
    border-radius: var(--radius-full);
}

.skeleton-avatar-sm {
    width: var(--size-sm);
    height: var(--size-sm);
}

.skeleton-avatar-lg {
    width: var(--size-lg);
    height: var(--size-lg);
}

/* Button */
.skeleton-button {
    height: var(--size-md);
    width: 6rem;
}

.skeleton-button-sm {
    height: var(--size-sm);
    width: 5rem;
}

/* Image */
.skeleton-image {
    width: 100%;
    height: 12rem;
}

.skeleton-image-square {
    aspect-ratio: 1;
    height: auto;
}

/* Card */
.skeleton-card {
    padding: var(--space-6);
    background-color: var(--color-background);
    border: 1px solid var(--color-border);
}

/* ─────────────────────────────────────────
   SKELETON PATTERNS
   ───────────────────────────────────────── */

/* User cell skeleton */
.skeleton-user-cell {
    display: flex;
    align-items: center;
    gap: var(--space-3);
}

.skeleton-user-cell .skeleton-info {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    flex: 1;
}

/* Table row skeleton */
.skeleton-table-row {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-3) 0;
}

.skeleton-table-row .skeleton-cell {
    height: 1rem;
}

/* Stat card skeleton */
.skeleton-stat-card {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
}

.skeleton-stat-card .skeleton-stat-title {
    height: 0.875rem;
    width: 40%;
}

.skeleton-stat-card .skeleton-stat-value {
    height: 2rem;
    width: 60%;
}

/* Chat item skeleton */  
.skeleton-chat-item {
    display: flex;
    gap: var(--space-3);
    padding: var(--space-3);
}

.skeleton-chat-item .skeleton-chat-content {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    flex: 1;
}

/* ─────────────────────────────────────────
   SPINNER COMPONENT
   ───────────────────────────────────────── */

.spinner {
    display: inline-block;
    width: 1.25rem;
    height: 1.25rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-brand);
    border-radius: var(--radius-full);
    animation: spinner-rotate 0.6s linear infinite;
}

@keyframes spinner-rotate {
    to { transform: rotate(360deg); }
}

/* Icon spinner - for rotating icons like bi bi-arrow-repeat */
i.spinner,
.icon-spin {
    display: inline-block;
    width: auto;
    height: auto;
    border: none;
    animation: spinner-rotate 1s linear infinite;
}

/* Spinner sizes */
.spinner-sm {
    width: 1rem;
    height: 1rem;
    border-width: 1.5px;
}

.spinner-lg {
    width: 2rem;
    height: 2rem;
    border-width: 3px;
}

.spinner-xl {
    width: 3rem;
    height: 3rem;
    border-width: 4px;
}

/* ─────────────────────────────────────────
   FULL PAGE LOADER
   ───────────────────────────────────────── */

.page-loader {
    position: fixed;
    inset: 0;
    z-index: var(--z-overlay);
    
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: var(--space-4);
    
    background-color: var(--color-background);
}

.page-loader-text {
    font-size: var(--font-size-sm);
    color: var(--color-foreground-muted);
}

/* ─────────────────────────────────────────
   INLINE LOADER
   ───────────────────────────────────────── */

.inline-loader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: var(--space-4);
    color: var(--color-foreground-muted);
}

.inline-loader-text {
    font-size: var(--font-size-sm);
}

/* ─────────────────────────────────────────
   PROGRESS BAR
   ───────────────────────────────────────── */

.progress {
    width: 100%;
    height: 0.5rem;
    background-color: var(--color-background-muted);
    border-radius: var(--radius-full);
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background-color: var(--color-brand);
    border-radius: var(--radius-full);
    transition: width var(--duration-slow) var(--ease-out);
}

/* Indeterminate */
.progress-indeterminate .progress-bar {
    width: 30%;
    animation: progress-indeterminate 1.5s ease-in-out infinite;
}

@keyframes progress-indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
}

/* Progress variants */
.progress-success .progress-bar { background-color: var(--color-success); }
.progress-warning .progress-bar { background-color: var(--color-warning); }
.progress-danger .progress-bar { background-color: var(--color-danger); }

/* Progress sizes */
.progress-sm { height: 0.25rem; }
.progress-lg { height: 0.75rem; }

/* ─────────────────────────────────────────
   PULSE DOT LOADER
   ───────────────────────────────────────── */

.pulse-loader {
    display: flex;
    gap: var(--space-1);
}

.pulse-loader-dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: var(--radius-full);
    background-color: var(--color-brand);
    animation: pulse-loader 1.4s ease-in-out infinite both;
}

.pulse-loader-dot:nth-child(1) { animation-delay: -0.32s; }
.pulse-loader-dot:nth-child(2) { animation-delay: -0.16s; }
.pulse-loader-dot:nth-child(3) { animation-delay: 0s; }

@keyframes pulse-loader {
    0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
    }
    40% {
        transform: scale(1);
        opacity: 1;
    }
}
</style>
