{#
  Table Component
  
  Usage:
    {% include "components/table.html" %}
    
    HTML:
    <div class="table-wrapper">
      <table class="table">
        <thead><tr><th>Name</th><th>Status</th></tr></thead>
        <tbody><tr><td>John</td><td>Active</td></tr></tbody>
      </table>
    </div>
#}
<style>
/* ===========================================
   TABLE COMPONENT
   =========================================== */

/* Table Wrapper (for overflow) */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
}

/* Base Table */
.table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--font-size-base);
}

.table caption {
    padding: var(--space-4);
    font-size: var(--font-size-sm);
    color: var(--color-foreground-muted);
    text-align: left;
}

/* Header */
.table thead {
    background-color: var(--color-background-muted);
}

.table th {
    padding: var(--space-3) var(--space-4);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground-muted);
    text-align: left;
    white-space: nowrap;
}

/* Body */
.table tbody tr {
    border-top: 1px solid var(--color-border);
    transition: background-color var(--duration-fast);
}

.table tbody tr:first-child {
    border-top: none;
}

.table tbody tr:hover {
    background-color: var(--color-background-subtle);
}

.table td {
    padding: var(--space-3) var(--space-4);
    vertical-align: middle;
}

/* ─────────────────────────────────────────
   TABLE VARIANTS
   ───────────────────────────────────────── */

/* Striped */
.table-striped tbody tr:nth-child(even) {
    background-color: var(--color-background-subtle);
}

/* Compact */
.table-sm th,
.table-sm td {
    padding: var(--space-2) var(--space-3);
    font-size: var(--font-size-sm);
}

/* Large */
.table-lg th,
.table-lg td {
    padding: var(--space-4) var(--space-5);
}

/* Borderless */
.table-borderless tbody tr {
    border: none;
}

/* No wrapper border */
.table-wrapper-borderless {
    border: none;
}

/* ─────────────────────────────────────────
   SORTABLE TABLE HEADERS
   ───────────────────────────────────────── */

.table th.sortable {
    cursor: pointer;
    user-select: none;
}

.table th.sortable:hover {
    background-color: var(--color-background-emphasized);
}

.table th.sortable::after {
    content: "";
    display: inline-block;
    width: 0.5rem;
    height: 0.5rem;
    margin-left: var(--space-2);
    opacity: 0.3;
}

.table th.sort-asc::after {
    content: "▲";
    opacity: 1;
}

.table th.sort-desc::after {
    content: "▼";
    opacity: 1;
}

/* ─────────────────────────────────────────
   SELECTABLE ROWS
   ───────────────────────────────────────── */

.table-selectable tbody tr {
    cursor: pointer;
}

.table-selectable tbody tr.is-selected {
    background-color: var(--color-brand-muted);
}

.table-selectable tbody tr.is-selected:hover {
    background-color: var(--color-brand-muted);
}

/* ─────────────────────────────────────────
   TABLE CELL UTILITIES
   ───────────────────────────────────────── */

.table .cell-actions {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    justify-content: flex-end;
}

.table .cell-numeric {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.table .cell-nowrap {
    white-space: nowrap;
}

.table .cell-truncate {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* ─────────────────────────────────────────
   EMPTY STATE
   ───────────────────────────────────────── */

.table-empty {
    padding: var(--space-12) var(--space-4);
    text-align: center;
}

.table-empty-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3rem;
    height: 3rem;
    margin: 0 auto var(--space-4);
    border-radius: var(--radius-full);
    background-color: var(--color-background-muted);
    color: var(--color-foreground-subtle);
}

.table-empty-title {
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground);
    margin-bottom: var(--space-1);
}

.table-empty-description {
    font-size: var(--font-size-sm);
    color: var(--color-foreground-muted);
}

/* ─────────────────────────────────────────
   DATA LIST (Alternative to table)
   ───────────────────────────────────────── */

.data-list {
    display: flex;
    flex-direction: column;
}

.data-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--color-border);
}

.data-list-item:last-child {
    border-bottom: none;
}

.data-list-label {
    font-size: var(--font-size-sm);
    color: var(--color-foreground-muted);
}

.data-list-value {
    font-size: var(--font-size-base);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground);
}

/* ─────────────────────────────────────────
   PAGINATION
   ───────────────────────────────────────── */

.pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-top: 1px solid var(--color-border);
}

.pagination-info {
    font-size: var(--font-size-sm);
    color: var(--color-foreground-muted);
}

.pagination-controls {
    display: flex;
    align-items: center;
    gap: var(--space-1);
}

.pagination-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: var(--size-sm);
    height: var(--size-sm);
    padding: 0 var(--space-2);
    
    font-size: var(--font-size-sm);
    color: var(--color-foreground);
    
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background-color: var(--color-background);
    
    cursor: pointer;
    transition: background-color var(--duration-fast), border-color var(--duration-fast);
}

.pagination-btn:hover:not(:disabled) {
    background-color: var(--color-background-muted);
    border-color: var(--color-border-hover);
}

.pagination-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.pagination-btn.is-active {
    background-color: var(--color-brand);
    border-color: var(--color-brand);
    color: white;
}
</style>
