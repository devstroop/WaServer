{#
  Button Component
  
  Variants: default, secondary, outline, ghost, destructive, link
  Sizes: sm, md, lg, icon
  
  Usage:
    {% include "components/button.html" %}
    
    HTML:
    <button class="btn btn-default">Click me</button>
    <button class="btn btn-outline btn-sm">Small</button>
    <button class="btn btn-icon"><i class="bi bi-plus"></i></button>
#}
<style>
/* ===========================================
   BUTTON COMPONENT
   =========================================== */

/* Base Button - WhatsApp Style */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    
    font-family: var(--font-family);
    font-size: var(--font-size-base);
    font-weight: var(--font-weight-medium);
    line-height: 1;
    white-space: nowrap;
    text-decoration: none;
    
    height: var(--size-md);
    padding: 0 var(--space-5);
    
    border: none;
    border-radius: var(--radius-full);  /* WhatsApp uses pill-shaped buttons */
    
    cursor: pointer;
    user-select: none;
    
    transition: background-color var(--duration-fast), transform var(--duration-fast);
}

.btn:active {
    transform: scale(0.98);
}

.btn:focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
}

.btn:disabled,
.btn[disabled],
.btn.btn-disabled {
    pointer-events: none;
    opacity: 0.5;
}

/* ─────────────────────────────────────────
   BUTTON VARIANTS
   ───────────────────────────────────────── */

/* Default (Primary/Brand) - WhatsApp Teal */
.btn-default,
.btn-primary {
    background-color: var(--color-brand);
    color: white;
}

.btn-default:hover,
.btn-primary:hover {
    background-color: var(--color-brand-hover);
}

.btn-default:active,
.btn-primary:active {
    background-color: var(--color-brand-active);
}

/* Secondary */
.btn-secondary {
    background-color: var(--color-background-muted);
    border-color: var(--color-background-muted);
    color: var(--color-foreground);
}

.btn-secondary:hover {
    background-color: var(--color-background-emphasized);
    border-color: var(--color-background-emphasized);
}

/* Outline */
.btn-outline {
    background-color: transparent;
    border-color: var(--color-border);
    color: var(--color-foreground);
}

.btn-outline:hover {
    background-color: var(--color-background-muted);
    border-color: var(--color-border-hover);
}

/* Ghost - WhatsApp icon button style */
.btn-ghost {
    background-color: transparent;
    color: var(--color-foreground-muted);
    border-radius: var(--radius-full);
}

.btn-ghost:hover {
    background-color: rgba(134, 150, 160, 0.15);
    color: var(--color-foreground);
}

/* Destructive */
.btn-destructive,
.btn-danger {
    background-color: var(--color-danger);
    border-color: var(--color-danger);
    color: white;
}

.btn-destructive:hover,
.btn-danger:hover {
    background-color: #d10030;
    border-color: #d10030;
}

.btn-destructive:focus-visible,
.btn-danger:focus-visible {
    box-shadow: var(--shadow-focus-danger);
}

/* Destructive Outline */
.btn-destructive-outline {
    background-color: transparent;
    border-color: var(--color-danger);
    color: var(--color-danger);
}

.btn-destructive-outline:hover {
    background-color: var(--color-danger-muted);
}

/* Link */
.btn-link {
    background-color: transparent;
    border-color: transparent;
    color: var(--color-brand);
    text-decoration: underline;
    text-underline-offset: 4px;
}

.btn-link:hover {
    color: var(--color-brand-hover);
}

/* Success */
.btn-success {
    background-color: var(--color-success);
    border-color: var(--color-success);
    color: white;
}

.btn-success:hover {
    background-color: var(--color-brand-hover);
    border-color: var(--color-brand-hover);
}

/* Warning */
.btn-warning {
    background-color: var(--color-warning);
    border-color: var(--color-warning);
    color: var(--color-foreground);
}

.btn-warning:hover {
    background-color: #e5b83d;
    border-color: #e5b83d;
}

/* ─────────────────────────────────────────
   BUTTON SIZES
   ───────────────────────────────────────── */

.btn-xs {
    height: var(--size-xs);
    padding: 0 var(--space-2);
    font-size: var(--font-size-xs);
    border-radius: var(--radius-sm);
}

.btn-sm {
    height: var(--size-sm);
    padding: 0 var(--space-3);
    font-size: var(--font-size-sm);
}

.btn-lg {
    height: var(--size-lg);
    padding: 0 var(--space-6);
    font-size: var(--font-size-md);
}

.btn-xl {
    height: var(--size-xl);
    padding: 0 var(--space-8);
    font-size: var(--font-size-lg);
}

/* Icon Button - WhatsApp circular action buttons */
.btn-icon {
    width: var(--size-md);
    height: var(--size-md);
    padding: 0;
    border-radius: var(--radius-full);
    color: var(--color-foreground-muted);
    background-color: transparent;
}

.btn-icon:hover {
    background-color: rgba(134, 150, 160, 0.15);
    color: var(--color-foreground);
}

.btn-icon.btn-xs {
    width: var(--size-xs);
    height: var(--size-xs);
}

.btn-icon.btn-sm {
    width: var(--size-sm);
    height: var(--size-sm);
}

.btn-icon.btn-lg {
    width: var(--size-lg);
    height: var(--size-lg);
}

/* ─────────────────────────────────────────
   BUTTON MODIFIERS
   ───────────────────────────────────────── */

/* Full Width */
.btn-block {
    width: 100%;
}

/* Rounded */
.btn-rounded {
    border-radius: var(--radius-full);
}

/* Loading State */
.btn-loading {
    position: relative;
    color: transparent !important;
    pointer-events: none;
}

.btn-loading::after {
    content: "";
    position: absolute;
    width: 1em;
    height: 1em;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: var(--radius-full);
    animation: btn-spin 0.6s linear infinite;
}

.btn-default.btn-loading::after,
.btn-primary.btn-loading::after,
.btn-destructive.btn-loading::after {
    border-color: white;
    border-right-color: transparent;
}

@keyframes btn-spin {
    to { transform: rotate(360deg); }
}

/* Button Group */
.btn-group {
    display: inline-flex;
}

.btn-group > .btn {
    border-radius: 0;
}

.btn-group > .btn:first-child {
    border-top-left-radius: var(--radius-md);
    border-bottom-left-radius: var(--radius-md);
}

.btn-group > .btn:last-child {
    border-top-right-radius: var(--radius-md);
    border-bottom-right-radius: var(--radius-md);
}

.btn-group > .btn:not(:last-child) {
    border-right-width: 0;
}

.btn-group > .btn:hover {
    z-index: 1;
}
</style>
