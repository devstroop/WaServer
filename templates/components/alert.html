{#
  Alert Component
  
  Variants: default, success, warning, danger, info
  
  Usage:
    {% include "components/alert.html" %}
    
    HTML:
    <div class="alert alert-warning">
      <i class="bi bi-exclamation-triangle alert-icon"></i>
      <div class="alert-content">
        <h4 class="alert-title">Warning</h4>
        <p class="alert-description">This is a warning message</p>
      </div>
    </div>
#}
<style>
/* ===========================================
   ALERT COMPONENT
   =========================================== */

/* Base Alert */
.alert {
    display: flex;
    gap: var(--space-3);
    padding: var(--space-4);
    border-radius: var(--radius-lg);
    border: 1px solid transparent;
}

.alert-icon {
    flex-shrink: 0;
    width: 1.25rem;
    height: 1.25rem;
    margin-top: 0.125rem;
}

.alert-content {
    flex: 1;
    min-width: 0;
}

.alert-title {
    font-size: var(--font-size-base);
    font-weight: var(--font-weight-semibold);
    margin: 0 0 var(--space-1) 0;
    line-height: var(--line-height-tight);
}

.alert-description {
    font-size: var(--font-size-sm);
    margin: 0;
    line-height: var(--line-height-normal);
}

.alert-description:only-child {
    margin: 0;
}

.alert-actions {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-3);
}

/* ─────────────────────────────────────────
   ALERT VARIANTS
   ───────────────────────────────────────── */

/* Default/Info (WhatsApp blue info style) */
.alert,
.alert-default,
.alert-info {
    background-color: var(--color-info-muted);
    border-color: rgba(83, 189, 235, 0.3);
    color: var(--color-foreground);
}

.alert-info .alert-icon,
.alert-default .alert-icon {
    color: var(--color-info);
}

[data-bs-theme="dark"] .alert-info,
[data-bs-theme="dark"] .alert-default {
    background-color: rgba(83, 189, 235, 0.1);
}

/* Success (WhatsApp green) */
.alert-success {
    background-color: var(--color-success-muted);
    border-color: rgba(0, 168, 132, 0.3);
    color: var(--color-foreground);
}

.alert-success .alert-icon {
    color: var(--color-success);
}

[data-bs-theme="dark"] .alert-success {
    background-color: rgba(0, 168, 132, 0.1);
}

/* Warning (Yellow) */
.alert-warning {
    background-color: var(--color-warning-muted);
    border-color: rgba(255, 193, 7, 0.4);
    color: var(--color-foreground);
}

.alert-warning .alert-icon {
    color: #b8860b;
}

[data-bs-theme="dark"] .alert-warning {
    background-color: rgba(255, 193, 7, 0.1);
    border-color: rgba(255, 193, 7, 0.3);
}

[data-bs-theme="dark"] .alert-warning .alert-icon {
    color: var(--color-warning);
}

/* Danger/Error (WhatsApp red) */
.alert-danger,
.alert-error {
    background-color: var(--color-danger-muted);
    border-color: rgba(234, 0, 56, 0.3);
    color: var(--color-foreground);
}

.alert-danger .alert-icon,
.alert-error .alert-icon {
    color: var(--color-danger);
}

[data-bs-theme="dark"] .alert-danger,
[data-bs-theme="dark"] .alert-error {
    background-color: rgba(234, 0, 56, 0.1);
}

/* ─────────────────────────────────────────
   COMPACT ALERT (inline style)
   ───────────────────────────────────────── */

.alert-compact {
    padding: var(--space-3);
    align-items: center;
}

.alert-compact .alert-title {
    margin: 0;
}

.alert-compact .alert-description {
    font-size: var(--font-size-sm);
}

/* ─────────────────────────────────────────
   DISMISSIBLE ALERT
   ───────────────────────────────────────── */

.alert-dismissible {
    padding-right: var(--space-10);
    position: relative;
}

.alert-close {
    position: absolute;
    top: var(--space-3);
    right: var(--space-3);
    padding: var(--space-1);
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-foreground-muted);
    transition: color var(--duration-fast), background-color var(--duration-fast);
}

.alert-close:hover {
    color: var(--color-foreground);
    background-color: rgba(0, 0, 0, 0.05);
}

[data-bs-theme="dark"] .alert-close:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

/* ─────────────────────────────────────────
   INFO MESSAGE (WhatsApp system message style)
   From the Medium article about WhatsApp CSS
   ───────────────────────────────────────── */

.info-message {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background-color: var(--color-info-message);
    border-radius: var(--radius-lg);
    font-size: var(--font-size-xs);
    color: var(--color-foreground-muted);
    text-align: center;
    max-width: fit-content;
    margin: var(--space-2) auto;
}

.info-message-icon {
    opacity: 0.7;
}

/* System encrypted message style */
.encrypted-message {
    background-color: var(--color-encrypted-message);
}
</style>
