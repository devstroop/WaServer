{#
  Toast/Notification Component - WhatsApp Style
  
  Variants: default, success, error, warning, info
  
  Usage:
    {% include "components/toast.html" %}
    
    HTML:
    <div class="toast-container">
      <div class="toast toast-success">
        <div class="toast-icon"><i class="bi bi-check-circle-fill"></i></div>
        <div class="toast-content">Message sent</div>
      </div>
    </div>
    
    JS:
    toast.success('Message sent');
#}
<style>
/* ===========================================
   TOAST/NOTIFICATION COMPONENT
   WhatsApp-style bottom notification bar
   =========================================== */

/* Toast Container */
.toast-container {
    position: fixed;
    z-index: var(--z-toast);
    
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    
    width: 100%;
    padding: var(--space-4);
    
    pointer-events: none;
}

/* Default position: bottom center (WhatsApp style) */
.toast-container,
.toast-container-bottom-center {
    bottom: 0;
    left: 0;
    right: 0;
}

.toast-container-bottom-right {
    bottom: 0;
    right: 0;
    left: auto;
    align-items: flex-end;
    max-width: 24rem;
}

.toast-container-bottom-left {
    bottom: 0;
    left: 0;
    right: auto;
    align-items: flex-start;
    max-width: 24rem;
}

.toast-container-top-right {
    top: 0;
    right: 0;
    bottom: auto;
    left: auto;
    align-items: flex-end;
    max-width: 24rem;
}

.toast-container-top-left {
    top: 0;
    left: 0;
    right: auto;
    bottom: auto;
    align-items: flex-start;
    max-width: 24rem;
}

.toast-container-top-center {
    top: 0;
    left: 0;
    right: 0;
    bottom: auto;
}

/* Base Toast - WhatsApp notification bar style */
.toast {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    
    padding: var(--space-3) var(--space-4);
    
    font-size: var(--font-size-sm);
    color: white;
    
    background-color: #323739;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    
    pointer-events: auto;
    
    animation: toast-slide-up var(--duration-normal) var(--ease-out);
}

.toast.is-leaving {
    animation: toast-slide-down var(--duration-fast) var(--ease-in) forwards;
}

@keyframes toast-slide-up {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes toast-slide-down {
    from {
        opacity: 1;
        transform: translateY(0);
    }
    to {
        opacity: 0;
        transform: translateY(20px);
    }
}

/* ─────────────────────────────────────────
   TOAST PARTS
   ───────────────────────────────────────── */

.toast-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.toast-content {
    flex: 1;
    min-width: 0;
}

.toast-title {
    font-weight: var(--font-weight-medium);
}

.toast-description {
    opacity: 0.9;
    margin-top: var(--space-0-5);
}

.toast-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.25rem;
    height: 1.25rem;
    padding: 0;
    margin-left: var(--space-2);
    
    border: none;
    border-radius: var(--radius-sm);
    background-color: transparent;
    
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    
    transition: color var(--duration-fast);
    flex-shrink: 0;
}

.toast-close:hover {
    color: white;
}

/* ─────────────────────────────────────────
   TOAST VARIANTS - WhatsApp colors
   ───────────────────────────────────────── */

/* Success - WhatsApp green bar */
.toast-success {
    background-color: var(--color-brand);
}

/* Error */
.toast-error,
.toast-danger {
    background-color: var(--color-danger);
}

/* Warning */
.toast-warning {
    background-color: #f5a623;
}

/* Info */
.toast-info {
    background-color: var(--color-info);
}

/* Loading - with spinner */
.toast-loading {
    background-color: #323739;
}

.toast-loading .toast-icon {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: toast-spin 0.8s linear infinite;
}

@keyframes toast-spin {
    to {
        transform: rotate(360deg);
    }
}

/* ─────────────────────────────────────────
   TOAST ACTIONS
   ───────────────────────────────────────── */

.toast-action {
    display: inline-flex;
    align-items: center;
    padding: var(--space-1) var(--space-2);
    margin-left: var(--space-2);
    
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: white;
    text-decoration: underline;
    text-underline-offset: 2px;
    
    background: transparent;
    border: none;
    cursor: pointer;
    
    transition: opacity var(--duration-fast);
}

.toast-action:hover {
    opacity: 0.8;
}
</style>

<script>
/* ===========================================
   TOAST JAVASCRIPT API
   =========================================== */

const toast = {
    container: null,
    defaultDuration: 4000,
    
    init() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
        return this.container;
    },
    
    show(message, options = {}) {
        this.init();
        
        const {
            variant = 'default',
            duration = this.defaultDuration,
            title = null,
            action = null
        } = options;
        
        const toastEl = document.createElement('div');
        toastEl.className = `toast toast-${variant}`;
        
        let html = '';
        
        // Icon
        const icons = {
            success: '<i class="bi bi-check-circle-fill"></i>',
            error: '<i class="bi bi-x-circle-fill"></i>',
            warning: '<i class="bi bi-exclamation-triangle-fill"></i>',
            info: '<i class="bi bi-info-circle-fill"></i>',
            loading: ''
        };
        
        if (icons[variant]) {
            html += `<div class="toast-icon">${icons[variant]}</div>`;
        }
        
        // Content
        html += '<div class="toast-content">';
        if (title) {
            html += `<div class="toast-title">${title}</div>`;
            html += `<div class="toast-description">${message}</div>`;
        } else {
            html += message;
        }
        html += '</div>';
        
        // Action
        if (action) {
            html += `<button class="toast-action" onclick="${action.onClick}">${action.label}</button>`;
        }
        
        toastEl.innerHTML = html;
        this.container.appendChild(toastEl);
        
        // Auto dismiss (except loading)
        if (variant !== 'loading' && duration > 0) {
            setTimeout(() => this.dismiss(toastEl), duration);
        }
        
        return toastEl;
    },
    
    dismiss(toastEl) {
        if (!toastEl || !toastEl.parentNode) return;
        
        toastEl.classList.add('is-leaving');
        setTimeout(() => {
            if (toastEl.parentNode) {
                toastEl.parentNode.removeChild(toastEl);
            }
        }, 200);
    },
    
    // Convenience methods
    success(message, options = {}) {
        return this.show(message, { ...options, variant: 'success' });
    },
    
    error(message, options = {}) {
        return this.show(message, { ...options, variant: 'error' });
    },
    
    warning(message, options = {}) {
        return this.show(message, { ...options, variant: 'warning' });
    },
    
    info(message, options = {}) {
        return this.show(message, { ...options, variant: 'info' });
    },
    
    loading(message = 'Loading...', options = {}) {
        return this.show(message, { ...options, variant: 'loading', duration: 0 });
    }
};

// Legacy function support
function showToast(options) {
    const { title, description, variant = 'default', duration } = options;
    return toast.show(description || title, { title: description ? title : null, variant, duration });
}

function dismissToast(toastEl) {
    toast.dismiss(toastEl);
}
</script>
