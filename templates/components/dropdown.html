{#
  Dropdown/Menu Component
  
  Usage:
    {% include "components/dropdown.html" %}
    
    HTML:
    <div class="dropdown">
      <button class="btn" data-dropdown-trigger>Options</button>
      <div class="dropdown-content">
        <a href="#" class="dropdown-item">Edit</a>
        <a href="#" class="dropdown-item">Duplicate</a>
        <div class="dropdown-separator"></div>
        <a href="#" class="dropdown-item dropdown-item-danger">Delete</a>
      </div>
    </div>
#}
<style>
/* ===========================================
   DROPDOWN/MENU COMPONENT
   =========================================== */

/* Dropdown Container */
.dropdown {
    position: relative;
    display: inline-block;
}

/* Dropdown Content - WhatsApp context menu style */
.dropdown-content {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: var(--z-dropdown);
    
    min-width: 200px;
    padding: var(--space-2) 0;
    margin-top: var(--space-1);
    
    background-color: var(--color-background-panel);
    border-radius: var(--radius-sm);
    box-shadow: 0 2px 5px rgba(11, 20, 26, 0.29), 0 2px 10px rgba(11, 20, 26, 0.2);
    
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity var(--duration-fast), visibility var(--duration-fast), transform var(--duration-fast);
}

[data-bs-theme="dark"] .dropdown-content {
    background-color: var(--color-background-subtle);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.3);
}

.dropdown.is-open .dropdown-content,
.dropdown:focus-within .dropdown-content {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

/* Position variants */
.dropdown-right .dropdown-content {
    left: auto;
    right: 0;
}

.dropdown-up .dropdown-content {
    top: auto;
    bottom: 100%;
    margin-top: 0;
    margin-bottom: var(--space-1);
}

/* ─────────────────────────────────────────
   DROPDOWN ITEMS
   ───────────────────────────────────────── */

.dropdown-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    
    width: 100%;
    padding: var(--space-2-5) var(--space-6);
    
    font-size: var(--font-size-base);
    color: var(--color-foreground);
    text-decoration: none;
    
    border: none;
    background: transparent;
    
    cursor: pointer;
    transition: background-color var(--duration-fast);
}

.dropdown-item:hover {
    background-color: var(--color-background-subtle);
}

[data-bs-theme="dark"] .dropdown-item:hover {
    background-color: var(--color-background-emphasized);
}

.dropdown-item:focus {
    outline: none;
    background-color: var(--color-background-subtle);
}

.dropdown-item:disabled,
.dropdown-item.is-disabled {
    opacity: 0.5;
    pointer-events: none;
}

/* Item icon */
.dropdown-item-icon {
    width: 1rem;
    color: var(--color-foreground-subtle);
}

/* Item shortcut */
.dropdown-item-shortcut {
    margin-left: auto;
    font-size: var(--font-size-xs);
    color: var(--color-foreground-subtle);
}

/* Danger variant */
.dropdown-item-danger {
    color: var(--color-danger);
}

.dropdown-item-danger:hover {
    background-color: var(--color-danger-muted);
}

/* ─────────────────────────────────────────
   DROPDOWN UTILITIES
   ───────────────────────────────────────── */

.dropdown-separator {
    height: 1px;
    margin: var(--space-1) 0;
    background-color: var(--color-border);
}

.dropdown-label {
    padding: var(--space-2) var(--space-3);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    color: var(--color-foreground-subtle);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Checkbox/Radio items */
.dropdown-item-check {
    padding-left: var(--space-8);
    position: relative;
}

.dropdown-item-check::before {
    content: "";
    position: absolute;
    left: var(--space-3);
    width: 1rem;
    height: 1rem;
}

.dropdown-item-check.is-checked::before {
    content: "✓";
    color: var(--color-brand);
}

/* ─────────────────────────────────────────
   CONTEXT MENU
   ───────────────────────────────────────── */

.context-menu {
    position: fixed;
    z-index: var(--z-popover);
    
    min-width: 10rem;
    padding: var(--space-1);
    
    background-color: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    
    opacity: 0;
    visibility: hidden;
}

.context-menu.is-open {
    opacity: 1;
    visibility: visible;
}

/* ─────────────────────────────────────────
   POPOVER
   ───────────────────────────────────────── */

.popover {
    position: absolute;
    z-index: var(--z-popover);
    
    padding: var(--space-4);
    
    background-color: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity var(--duration-fast), visibility var(--duration-fast), transform var(--duration-fast);
}

.popover.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.popover-arrow {
    position: absolute;
    width: 0.75rem;
    height: 0.75rem;
    background-color: var(--color-background);
    border: 1px solid var(--color-border);
    border-right: none;
    border-bottom: none;
    transform: rotate(45deg);
}

.popover-arrow-top {
    top: -0.4rem;
    left: 50%;
    margin-left: -0.375rem;
}

.popover-arrow-bottom {
    bottom: -0.4rem;
    left: 50%;
    margin-left: -0.375rem;
    transform: rotate(225deg);
}

/* ─────────────────────────────────────────
   TOOLTIP
   ───────────────────────────────────────── */

.tooltip {
    position: absolute;
    z-index: var(--z-tooltip);
    
    padding: var(--space-1-5) var(--space-2-5);
    
    font-size: var(--font-size-xs);
    color: white;
    
    background-color: var(--color-foreground);
    border-radius: var(--radius-md);
    
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--duration-fast);
}

.tooltip.is-visible {
    opacity: 1;
    visibility: visible;
}

/* Tooltip arrow */
.tooltip::after {
    content: "";
    position: absolute;
    border: 4px solid transparent;
}

.tooltip-top::after {
    top: 100%;
    left: 50%;
    margin-left: -4px;
    border-top-color: var(--color-foreground);
}

.tooltip-bottom::after {
    bottom: 100%;
    left: 50%;
    margin-left: -4px;
    border-bottom-color: var(--color-foreground);
}

[data-tooltip] {
    position: relative;
}

[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    padding: var(--space-1-5) var(--space-2-5);
    margin-bottom: var(--space-1);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-normal);
    color: white;
    background-color: var(--color-foreground);
    border-radius: var(--radius-md);
    white-space: nowrap;
    z-index: var(--z-tooltip);
}
</style>

<script>
// Dropdown toggle utility
document.addEventListener('click', function(e) {
    // Close all dropdowns when clicking outside
    if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown.is-open').forEach(function(dropdown) {
            dropdown.classList.remove('is-open');
        });
    }
    
    // Toggle dropdown on trigger click
    const trigger = e.target.closest('[data-dropdown-trigger]');
    if (trigger) {
        const dropdown = trigger.closest('.dropdown');
        if (dropdown) {
            e.preventDefault();
            dropdown.classList.toggle('is-open');
        }
    }
});

// Close dropdown on Escape
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('.dropdown.is-open').forEach(function(dropdown) {
            dropdown.classList.remove('is-open');
        });
    }
});
</script>
