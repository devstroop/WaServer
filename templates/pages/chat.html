{% extends "base.html" %}

{% block title %}Chats - WAS{% endblock %}
{% block page_title %}Chats{% endblock %}

{% block content %}
<div class="flex h-full" x-data="{ selectedChat: null }">
    <!-- Contact List -->
    <div class="w-80 border-r bg-card flex flex-col">
        <div class="p-4 border-b">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
                <input 
                    type="text" 
                    placeholder="Search chats..."
                    class="input pl-10"
                    hx-get="/partials/chat-list"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#chat-list"
                    name="search"
                >
            </div>
        </div>
        
        <div 
            id="chat-list"
            class="flex-1 overflow-y-auto"
            hx-get="/partials/chat-list"
            hx-trigger="load, every 30s"
            hx-swap="innerHTML"
        >
            <!-- Loading state -->
            <div class="p-4 space-y-3">
                <div class="flex items-center gap-3 animate-pulse"><div class="w-12 h-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 bg-muted rounded w-3/4"></div><div class="h-3 bg-muted rounded w-1/2"></div></div></div>
                <div class="flex items-center gap-3 animate-pulse"><div class="w-12 h-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 bg-muted rounded w-3/4"></div><div class="h-3 bg-muted rounded w-1/2"></div></div></div>
                <div class="flex items-center gap-3 animate-pulse"><div class="w-12 h-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 bg-muted rounded w-3/4"></div><div class="h-3 bg-muted rounded w-1/2"></div></div></div>
                <div class="flex items-center gap-3 animate-pulse"><div class="w-12 h-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 bg-muted rounded w-3/4"></div><div class="h-3 bg-muted rounded w-1/2"></div></div></div>
                <div class="flex items-center gap-3 animate-pulse"><div class="w-12 h-12 rounded-full bg-muted"></div><div class="flex-1 space-y-2"><div class="h-4 bg-muted rounded w-3/4"></div><div class="h-3 bg-muted rounded w-1/2"></div></div></div>
            </div>
        </div>
    </div>

    <!-- Chat View -->
    <div class="flex-1 flex flex-col">
        <div 
            id="chat-view"
            class="flex-1 flex flex-col"
        >
            <!-- Empty state -->
            <div class="flex flex-col items-center justify-center h-full text-muted-foreground bg-muted/30">
                <i data-lucide="message-square" class="h-16 w-16 mb-4 opacity-50"></i>
                <h2 class="text-xl font-semibold mb-2">WhatsApp Web</h2>
                <p class="text-sm">Select a chat to start messaging</p>
            </div>
        </div>
    </div>
</div>

<!-- SSE Connection for real-time messages -->
<div 
    hx-ext="sse" 
    sse-connect="/api/v1/chats/events"
    sse-swap="message"
    hx-target="#chat-messages"
    hx-swap="beforeend"
    class="hidden"
></div>
{% endblock %}

{% block scripts %}
<script>
function selectChat(chatId, chatName) {
    // Update chat view
    htmx.ajax('GET', `/partials/chat-view/${chatId}`, {target: '#chat-view', swap: 'innerHTML'});
    
    // Update selected state in sidebar
    document.querySelectorAll('[data-chat-item]').forEach(el => {
        el.classList.remove('bg-accent');
    });
    document.querySelector(`[data-chat-id="${chatId}"]`)?.classList.add('bg-accent');
}

function sendMessage(event) {
    event.preventDefault();
    const form = event.target;
    const input = form.querySelector('input[name="message"]');
    const chatId = form.dataset.chatId;
    
    if (!input.value.trim()) return;
    
    htmx.ajax('POST', `/api/v1/messages`, {
        target: '#chat-messages',
        swap: 'beforeend',
        values: {
            chat_id: chatId,
            message: input.value
        }
    });
    
    input.value = '';
}
</script>
{% endblock %}
