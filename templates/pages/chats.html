{% extends "base.html" %}

{% block title %}Chats - WAS{% endblock %}
{% block page_title %}Chats{% endblock %}

{% block head %}
<style>
    /* Override main-content for full-height chat layout */
    .main-content { padding: 0 !important; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex" style="height: 100%;">
    <!-- Contact List -->
    <div class="chat-sidebar border-end bg-body d-flex flex-column" style="width: 320px; min-width: 280px;">
        <div class="p-3 border-bottom">
            <div class="search-bar">
                <i class="bi bi-search search-icon"></i>
                <input 
                    type="text" 
                    placeholder="Search chats..."
                    class="input"
                    hx-get="/partials/chat-list"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#chat-list"
                    name="search"
                >
            </div>
        </div>
        
        <div 
            id="chat-list"
            class="flex-grow-1 overflow-auto u-scroll"
            hx-get="/partials/chat-list"
            hx-trigger="load, every 30s"
            hx-swap="innerHTML"
        >
            <!-- Loading state -->
            <div class="p-3 d-flex flex-column gap-3">
                <div class="d-flex align-items-center gap-3"><div class="skeleton skeleton-circle" style="width:48px;height:48px"></div><div class="flex-grow-1 d-flex flex-column gap-2"><div class="skeleton skeleton-text" style="width:75%"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                <div class="d-flex align-items-center gap-3"><div class="skeleton skeleton-circle" style="width:48px;height:48px"></div><div class="flex-grow-1 d-flex flex-column gap-2"><div class="skeleton skeleton-text" style="width:75%"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                <div class="d-flex align-items-center gap-3"><div class="skeleton skeleton-circle" style="width:48px;height:48px"></div><div class="flex-grow-1 d-flex flex-column gap-2"><div class="skeleton skeleton-text" style="width:75%"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                <div class="d-flex align-items-center gap-3"><div class="skeleton skeleton-circle" style="width:48px;height:48px"></div><div class="flex-grow-1 d-flex flex-column gap-2"><div class="skeleton skeleton-text" style="width:75%"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
            </div>
        </div>
    </div>

    <!-- Chat View -->
    <div class="flex-grow-1 d-flex flex-column">
        <div 
            id="chat-view"
            class="flex-grow-1 d-flex flex-column"
        >
            <!-- Empty state -->
            <div class="d-flex flex-column align-items-center justify-content-center h-100" style="background: var(--color-background-chat);">
                <i class="bi bi-chat-dots icon-4xl mb-3" style="opacity:0.3;color:var(--color-foreground-muted)"></i>
                <h2 class="h5 font-semibold mb-2" style="color:var(--color-foreground)">WhatsApp Web</h2>
                <p class="text-sm text-muted">Select a chat to start messaging</p>
            </div>
        </div>
    </div>
</div>

<!-- SSE Connection for real-time messages -->
<div 
    hx-ext="sse" 
    sse-connect="/api/v1/chats/events"
    sse-swap="message"
    hx-target="#chat-messages"
    hx-swap="beforeend"
    class="d-none"
></div>
{% endblock %}

{% block scripts %}
<script>
function selectChat(chatId, chatName) {
    // Update chat view
    htmx.ajax('GET', `/partials/chat-view/${chatId}`, {target: '#chat-view', swap: 'innerHTML'});
    
    // Update selected state in sidebar
    document.querySelectorAll('[data-chat-item]').forEach(el => {
        el.classList.remove('active');
    });
    document.querySelector(`[data-chat-id="${chatId}"]`)?.classList.add('active');
}

function sendMessage(event) {
    event.preventDefault();
    const form = event.target;
    const input = form.querySelector('input[name="message"]');
    const chatId = form.dataset.chatId;
    
    if (!input.value.trim()) return;
    
    htmx.ajax('POST', `/api/v1/messages`, {
        target: '#chat-messages',
        swap: 'beforeend',
        values: {
            chat_id: chatId,
            message: input.value
        }
    });
    
    input.value = '';
}
</script>
{% endblock %}
