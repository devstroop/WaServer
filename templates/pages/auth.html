{% extends "base.html" %}

{% block title %}Authentication - WAS{% endblock %}
{% block page_title %}Authentication{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-6 bg-muted/30">
    <div 
        id="auth-panel"
        hx-get="/partials/auth-panel"
        hx-trigger="load"
        hx-swap="innerHTML"
        class="w-full max-w-md"
    >
        <!-- Loading state -->
        <div class="card p-6">
            <div class="flex flex-col items-center gap-4 py-8">
                <div class="w-16 h-16 flex items-center justify-center rounded-full bg-whatsapp/10">
                    <i data-lucide="loader-2" class="h-8 w-8 text-whatsapp animate-spin"></i>
                </div>
                <p class="text-sm text-muted-foreground text-center">Loading authentication...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
