{% extends "base.html" %}

{% block title %}Authentication - WAS{% endblock %}
{% block page_title %}Authentication{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-6" style="background-color: var(--color-background-subtle)">
    <div 
        id="auth-panel"
        hx-get="/partials/auth-panel"
        hx-trigger="load"
        hx-swap="innerHTML"
        class="w-full" style="max-width: 28rem;"
    >
        <!-- Loading state -->
        <div class="card">
            <div class="card-content flex flex-col items-center gap-4 py-8">
                <div class="flex items-center justify-center rounded-full" style="width:4rem;height:4rem;background-color:var(--color-brand-muted)">
                    <div class="spinner" style="width:2rem;height:2rem;border-color:var(--color-brand);border-right-color:transparent"></div>
                </div>
                <p class="text-sm text-muted-foreground text-center">Loading authentication...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
