{% extends "web/base.html" %}
{% block body %}
<div class="dt-layout">
  <aside class="dt-sidebar" id="app-sidebar">
    <div class="dt-sidebar-header">
      <span class="dt-sidebar-title">WAS Admin <span class="dt-badge">v{{ version }}</span></span>
    </div>
    <nav class="dt-sidebar-nav">
      <a class="dt-sidebar-link" href="/app">Overview</a>
      <a class="dt-sidebar-link" href="/app/instances">Instances</a>
      <a class="dt-sidebar-link" href="/app/send">Send</a>
      <a class="dt-sidebar-link dt-sidebar-link--active" href="/app/users" aria-current="page">Users</a>
    </nav>
    <div class="dt-sidebar-footer">
      <label class="dt-theme-row">
        <span>Dark mode</span>
        <input type="checkbox" class="dt-switch" data-dt-theme-switch>
      </label>
    </div>
  </aside>
  <div class="dt-layout-main">
    <header class="dt-topbar">
      <button class="dt-button dt-button--ghost dt-button--icon-only"
              data-dt-sidebar-toggle="#app-sidebar"
              aria-label="Toggle navigation">&#9776;</button>
      <span class="dt-topbar-spacer"></span>
      <span class="dt-topbar-user">{{ username }} &middot; {{ role }}</span>
      <button class="dt-button dt-button--ghost" type="button"
              hx-post="/app/logout" hx-swap="none">Sign out</button>
    </header>
    <main class="dt-layout-content" id="content">

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h1 style="margin:0;">Users</h1>
        <button class="dt-button dt-button--primary" type="button"
                data-dt-dialog-open="#create-user-dialog">New user</button>
      </div>

      <dialog id="create-user-dialog" class="dt-dialog" data-dt-dialog>
        <form class="dt-dialog-body"
              hx-post="/app/users"
              hx-target="#create-user-feedback"
              hx-swap="innerHTML"
              hx-on::after-request="if (event.detail.successful) { this.closest('dialog').close(); htmx.ajax('GET','/app/fragments/users',{target:'#user-table',swap:'innerHTML'}); }">
          <h2>Create user</h2>
          <div id="create-user-feedback" aria-live="polite"></div>
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <div class="dt-field">
            <label class="dt-field-label" for="nu-username">Username</label>
            <input class="dt-input" type="text" id="nu-username" name="username" required data-dt-required
                   data-dt-required-message="Username is required">
          </div>
          <div class="dt-field">
            <label class="dt-field-label" for="nu-email">Email (optional)</label>
            <input class="dt-input" type="email" id="nu-email" name="email">
          </div>
          <div class="dt-field">
            <label class="dt-field-label" for="nu-password">Password</label>
            <input class="dt-input" type="password" id="nu-password" name="password" minlength="8" required
                   data-dt-required data-dt-minlength="8"
                   data-dt-minlength-message="At least 8 characters">
          </div>
          <div class="dt-field">
            <label class="dt-field-label" for="nu-role">Role</label>
            <select class="dt-input" id="nu-role" name="role">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="dt-button dt-button--ghost" type="button" data-dt-dialog-close>Cancel</button>
            <button class="dt-button dt-button--primary" type="submit">Create</button>
          </div>
        </form>
      </dialog>

      <div id="user-table"
           hx-get="/app/fragments/users"
           hx-trigger="load"
           hx-swap="innerHTML">
        <p class="dt-text-muted">Loading…</p>
      </div>
    </main>
  </div>
</div>
{% endblock %}
