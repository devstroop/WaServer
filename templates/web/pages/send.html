{% extends "web/base.html" %}
{% block body %}
<div class="dt-layout">
  <aside class="dt-sidebar" id="app-sidebar">
    <div class="dt-sidebar-header">
      <span class="dt-sidebar-title">WAS Admin <span class="dt-badge">v{{ version }}</span></span>
    </div>
    <nav class="dt-sidebar-nav">
      <a class="dt-sidebar-link" href="/app">Overview</a>
      <a class="dt-sidebar-link" href="/app/instances">Instances</a>
      <a class="dt-sidebar-link dt-sidebar-link--active" href="/app/send" aria-current="page">Send</a>
      {% if admin %}
      <a class="dt-sidebar-link" href="/app/users">Users</a>
      {% endif %}
    </nav>
    <div class="dt-sidebar-footer">
      <label class="dt-theme-row">
        <span>Dark mode</span>
        <input type="checkbox" class="dt-switch" data-dt-theme-switch>
      </label>
    </div>
  </aside>
  <div class="dt-layout-main">
    <header class="dt-topbar">
      <button class="dt-button dt-button--ghost dt-button--icon-only"
              data-dt-sidebar-toggle="#app-sidebar"
              aria-label="Toggle navigation">&#9776;</button>
      <span class="dt-topbar-spacer"></span>
      <span class="dt-topbar-user">{{ username }} &middot; {{ role }}</span>
      <button class="dt-button dt-button--ghost" type="button"
              hx-post="/app/logout" hx-swap="none">Sign out</button>
    </header>
    <main class="dt-layout-content" id="content">

      <h1 style="margin-bottom:16px;">Send message</h1>

      {% if instances.is_empty() %}
      <div class="dt-alert dt-alert--warning" role="status">
        <div class="dt-alert-content">
          No instances available. <a href="/app/instances">Create one</a> or wait for an active instance.
        </div>
      </div>
      {% endif %}

      <section class="dt-card">
        <div class="dt-card-body">
          <form hx-post="/app/send"
                hx-target="#send-feedback" hx-swap="innerHTML"
                hx-encoding="multipart/form-data">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <div style="display:flex; gap:16px; flex-wrap:wrap;">
              <div class="dt-field" style="flex:1; min-width:200px;">
                <label class="dt-field-label" for="send-instance">Instance</label>
                <select class="dt-input" id="send-instance" name="instance_id" required data-dt-required
                        data-dt-required-message="Select an instance">
                  <option value="" disabled selected>— choose instance —</option>
                  {% for inst in instances %}
                  <option value="{{ inst.id }}">{{ inst.label }} — {{ inst.status }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="dt-field" style="flex:1; min-width:200px;">
                <label class="dt-field-label" for="send-phone">Phone (E.164)</label>
                <input class="dt-input" type="text" id="send-phone" name="phone"
                       placeholder="+15551234567" required data-dt-required
                       data-dt-required-message="Phone is required">
              </div>
            </div>
            <div class="dt-field" style="margin-top:12px;">
              <label class="dt-field-label" for="send-text">Message or caption</label>
              <input class="dt-input" type="text" id="send-text" name="text"
                     placeholder="Hello from WAS">
            </div>
            <div style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:8px;">
              <div class="dt-field" style="flex:1;">
                <label class="dt-field-label" for="send-file">Attachment (optional)</label>
                <input class="dt-input" type="file" id="send-file" name="file">
              </div>
              <button class="dt-button dt-button--primary" type="submit">
                Send
                <span class="htmx-indicator">…</span>
              </button>
            </div>
          </form>
          <div id="send-feedback" aria-live="polite" style="margin-top:8px;"></div>
        </div>
      </section>

    </main>
  </div>
</div>
{% endblock %}
