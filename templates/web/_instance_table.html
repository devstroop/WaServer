{% if instances.is_empty() %}
<div class="dt-card">
  <div class="dt-card-body">
    <p class="dt-text-muted">No instances registered yet. Use “New instance” to add one.</p>
  </div>
</div>
{% else %}
<div class="dt-table-wrap">
  <table class="dt-table">
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
      {% for row in instances %}
      <tr>
        <td>{{ row.label }}</td>
        <td>{{ row.phone }}</td>
        <td><span class="dt-badge {{ row.badge_class }}">{{ row.status }}</span></td>
        <td style="text-align:right;">
          <a class="dt-button dt-button--ghost dt-button--sm" href="/app/instances/{{ row.id }}">Open</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
