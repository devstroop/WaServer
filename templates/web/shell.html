{% extends "web/base.html" %}
{% block body %}
<div class="dt-layout">
  <aside class="dt-sidebar" id="app-sidebar">
    <div class="dt-sidebar-header">
      <span class="dt-sidebar-title">WAS Admin <span class="dt-badge">v{{ version }}</span></span>
    </div>
    <nav class="dt-sidebar-nav">
      <a class="dt-sidebar-link dt-sidebar-link--active" href="/app" aria-current="page">Overview</a>
      <a class="dt-sidebar-link" href="/app/instances">Instances</a>
      <a class="dt-sidebar-link" href="/app/send">Send</a>
      {% if admin %}
      <a class="dt-sidebar-link" href="/app/users">Users</a>
      {% endif %}
    </nav>
    <div class="dt-sidebar-footer">
      <label class="dt-theme-row">
        <span>Dark mode</span>
        <input type="checkbox" class="dt-switch" data-dt-theme-switch>
      </label>
    </div>
  </aside>
  <div class="dt-layout-main">
    <header class="dt-topbar">
      <button class="dt-button dt-button--ghost dt-button--icon-only"
              data-dt-sidebar-toggle="#app-sidebar"
              aria-label="Toggle navigation">&#9776;</button>
      <span class="dt-topbar-spacer"></span>
      <span class="dt-topbar-user">{{ username }} &middot; {{ role }}</span>
      <button class="dt-button dt-button--ghost" type="button"
              hx-post="/app/logout"
              hx-swap="none">Sign out</button>
    </header>
    <main class="dt-layout-content" id="content">
      <div id="overview"
           hx-get="/app/fragments/overview" hx-trigger="load"
           hx-sse="connect:/app/events" hx-sse:swap="overview"
           hx-swap="innerHTML">
        <p class="dt-text-muted">Loading…</p>
      </div>
    </main>
  </div>
</div>
{% endblock %}
