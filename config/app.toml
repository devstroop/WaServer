[server]
host = "0.0.0.0"
port = 3000

[browser]
headless = false
timeout_ms = 30000
# Browser arguments for better performance and compatibility
args = [
    "--disable-blink-features=AutomationControlled",
    "--no-sandbox",
    "--disable-setuid-sandbox",
    "--disable-dev-shm-usage",
    "--disable-extensions",
    "--disable-popup-blocking",
    "--disable-gpu",
    "--disable-software-rasterizer"
]

[auth]
# Set your secure API token here
api_token = "test-api-token-123456789"

[logging]
level = "info"
# Available levels: trace, debug, info, warn, error

[cache]
default_ttl_minutes = 15

[cors]
allow_origins = ["*"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["authorization", "content-type"]

[limits]
# Maximum concurrent requests
max_concurrent_requests = 10
# Request timeout in milliseconds
request_timeout_ms = 60000
# Maximum file upload size in bytes (10MB)
max_upload_size = 10485760

[environment]
environment = "development"
log_level = "info"
rust_log = "whatsapp_engine=info"
debug_mode = true
health_check_interval = 30

[mcp]
# Enable MCP (Model Context Protocol) server
enabled = true
# MCP endpoint path
endpoint = "/mcp"
# Enable SSE (Server-Sent Events) transport
sse_enabled = true
# SSE heartbeat interval in seconds
heartbeat_interval_secs = 30

# =============================================================================
# Webhooks - Event callbacks for message.received
# =============================================================================
[webhooks]
# Enable webhook callbacks
enabled = false
# Request timeout in milliseconds
timeout_ms = 5000
# Number of retry attempts on failure
retry_count = 3
# Delay between retries in milliseconds
retry_delay_ms = 1000

# Example webhook endpoint (uncomment to use):
# [[webhooks.endpoints]]
# url = "https://your-server.com/webhook/whatsapp"
# events = ["message.received"]  # or ["*"] for all events
# secret = "your-hmac-secret-for-signature-verification"
# headers = { "X-Custom-Header" = "value" }

# Multiple endpoints supported:
# [[webhooks.endpoints]]
# url = "https://n8n.example.com/webhook/abc123"
# events = ["message.received"]
