# WhatsApp Web Element Locators
# Update these when WhatsApp Web UI changes without recompiling
# Last updated: 2026-02-19

[dialog]
root = "[role='dialog']"
backdrop = "div[data-animate-modal-backdrop='true']"
popup = "div[data-animate-modal-popup='true']"
body = "div[data-animate-modal-body='true']"

[auth]
# Login method selection — chain syntax: scope >> text finds text within scope.
# The scope constrains to role=button elements; text match uses TreeWalker.
login_with_phone_link = "[role='button'] >> text:Log in with phone number"
login_with_qr_link = "[role='button'] >> text:Log in with QR code"
login_label = "text:Log into WhatsApp Web"

# Phone number input
phone_number_label = "text:Enter phone number"
phone_number_input = "[aria-label='Type your phone number to log in to WhatsApp']"
phone_submit_button = "button >> text:Next"
invalid_phone_dialog = "#app div[data-animate-modal-popup='true'] div[data-animate-modal-body='true']"

# Country code selector
country_dropdown = "button[style*='width: 100%']"
country_search_input = "input[type='text']"

# Phone verification code
code_on_phone_label = "Enter code on phone"
code_on_phone_value = "[aria-details='link-device-phone-number-code-screen-instructions']"
link_code_element = "[aria-details='link-device-phone-number-code-screen-instructions']"
link_code_digits = "[data-link-code]"

# QR Code
qr_loading = "svg[role='status']"
qr_canvas = "canvas[aria-label='Scan this QR code to link a device!']"
qr_reload_button = "[data-icon='refresh-large']"

# Authorization status
authorized_pane = "#pane-side"

[menu]
button = "span[data-icon='menu']"
dropdown = "[aria-label='Menu']"
logout = "text:Log out"
logout_confirm = "[role='dialog'] button"

[loading]
progress = "progress[max='100']"
phone_loader_parent = "#phoneLoaderParent"
phone_loader = "#phoneLoader"

[chat]
# Message input
message_input = "#app #main footer div[aria-placeholder='Type a message']"
message_contenteditable = "div[contenteditable='true'][aria-placeholder='Type a message']"
send_button = "span[data-icon='send']"
send_button_parent = "button span[data-icon='send']"

[attachment]
button = "button[title='Attach']"
plus_icon = "[data-icon='plus']"
menu_plus_icon = "[data-icon='attach-menu-plus']"
photo_video_input = "input[accept='image/*,video/mp4,video/3gpp,video/quicktime']"
caption_input = "#app div[aria-placeholder='Add a caption']"
document_input = "input[accept='*']"
send_button = "#app div[aria-label='Send']"

[scripts]
# JavaScript snippets for complex operations
qr_code_base64 = """
(function() {
    var canvas = document.querySelector("canvas[aria-label='Scan this QR code to link a device!']");
    if (canvas) {
        return canvas.toDataURL('image/png').split(',')[1];
    }
    return null;
})();
"""
