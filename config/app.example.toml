[server]
host = "0.0.0.0"
port = 3000

[browser]
headless = true
timeout_ms = 30000
# Browser arguments for better performance and compatibility
args = [
    "--disable-blink-features=AutomationControlled",
    "--no-sandbox",
    "--disable-setuid-sandbox",
    "--disable-dev-shm-usage",
    "--disable-extensions",
    "--disable-popup-blocking",
    "--disable-gpu",
    "--disable-software-rasterizer"
]

[auth]
# Static secret key for API authentication (CHANGE IN PRODUCTION)
secret_key = "change-this-secret-key-in-production"

[logging]
level = "info"
# Available levels: trace, debug, info, warn, error

[cache]
default_ttl_minutes = 15

[cors]
allow_origins = ["*"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["authorization", "content-type"]

[limits]
# Maximum concurrent requests
max_concurrent_requests = 50
# Request timeout in milliseconds
request_timeout_ms = 30000
# Maximum file upload size in bytes (10MB)
max_upload_size = 10485760

# Environment Configuration (can be overridden by environment variables)
[environment]
# Environment: "development", "staging", or "production"
environment = "development"
# Log level (override with RUST_LOG env var)
# Accepts: "trace", "debug", "info", "warn", "error" or full format "was=debug,hyper=info"
log_level = "info"
health_check_interval = 30

# =============================================================================
# Swagger UI - Interactive API documentation
# =============================================================================
[swagger]
# Enable Swagger UI (set to false to disable API docs in production)
enabled = true
# Swagger UI path
path = "/api-docs"

# =============================================================================
# Instances - Multi-instance configuration
# =============================================================================
# [instances]
# Base directory for all instance data (default: ~/.was/instances)
# base_directory = "/path/to/instances"

# [instances.defaults]
# Default idle timeout in seconds before auto-sleep (0 = never, default 300)
# idle_timeout = 300
# Default headless mode for new instances
# headless = true
