[package]
name = "wae-rust"
version = "0.1.0"
edition = "2021"
authors = ["Devstroop Technologies <info@devstroop.com>"]
description = "A high-performance WhatsApp Web automation engine built in Rust with parallel processing capabilities"
license = "MIT"
repository = "https://github.com/devstroop/wae-rust"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async and concurrency
futures = "0.3"
async-trait = "0.1"

# Browser automation
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
toml = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Authentication and security
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"

# OpenAPI documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# File handling
mime_guess = "2.0"
tempfile = "3.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.31"

# Regex for pattern matching
regex = "1.10"

[dev-dependencies]
tower-test = "0.4"
tokio-test = "0.4"
