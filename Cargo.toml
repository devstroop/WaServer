[package]
name = "whatsapp-engine"
version = "0.2.0"
edition = "2021"
authors = ["Devstroop Technologies <info@devstroop.com>"]
description = "A high-performance WhatsApp Web automation engine built in Rust - supports both library and API server modes"
license = "MIT"
repository = "https://github.com/devstroop/whatsapp-engine-rust"
keywords = ["whatsapp", "automation", "messaging", "api", "library"]
categories = ["api-bindings", "web-programming", "asynchronous"]

# Library configuration
[lib]
name = "wae_rust"
path = "src/lib.rs"

# Binary configuration (API server)
[[bin]]
name = "whatsapp-server"
path = "src/bin/whatsapp-server.rs"
required-features = ["api-server"]

[features]
default = ["full"]
api-server = [
    "axum", 
    "tower", 
    "tower-http", 
    "utoipa", 
    "utoipa-swagger-ui",
    "mime_guess"
]
full = ["api-server"]

[dependencies]
# Core library dependencies (always included)
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Browser automation
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
toml = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"

# Regex for pattern matching
regex = "1.10"

# File handling utilities
futures-util = "0.3.31"

# HTTP client (used by MCP client)
reqwest = { version = "0.11", features = ["json", "multipart"] }

# API server dependencies (optional - only when api-server feature is enabled)
axum = { version = "0.7", features = ["multipart"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

# OpenAPI documentation (for API server mode)
utoipa = { version = "4.0", features = ["axum_extras", "chrono"], optional = true }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }

# File handling (for API server mode)
mime_guess = { version = "2.0", optional = true }

[dev-dependencies]
tower-test = "0.4"
tokio-test = "0.4"
tempfile = "3.0"
