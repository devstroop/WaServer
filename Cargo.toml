[package]
name = "was"
version = "0.5.1"
edition = "2021"
authors = ["Devstroop Technologies <info@devstroop.com>"]
description = "WAS (WhatsAppServer) - A minimal WhatsApp Web automation server built in Rust with REST API for sending messages"
license = "MIT"
repository = "https://github.com/devstroop/was"
keywords = ["whatsapp", "automation", "messaging", "api", "server"]
categories = ["api-bindings", "web-programming", "asynchronous"]

# Library configuration
[lib]
name = "was"
path = "src/lib.rs"

# Binary configuration
[[bin]]
name = "was"
path = "src/bin/was.rs"

# ============================================================================
# Features
# ============================================================================

[features]
default = []

[dependencies]
# ============================================================================
# Core Dependencies (always included)
# ============================================================================

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Browser automation
chromiumoxide = { version = "0.5", features = ["tokio-runtime"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
toml = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"
regex = "1.10"

# MIME type detection for file uploads
mime_guess = "2.0"

# Embedded database (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# Hashing
sha2 = "0.10"

# Password hashing
bcrypt = "0.15"

# JWT authentication
jsonwebtoken = "9.3"

# Web framework
axum = { version = "0.7", features = ["multipart", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# OpenAPI documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# Web UI — server-rendered templates + embedded static assets (#28)
askama = "0.12"
rust-embed = "8"

[dev-dependencies]
tower-test = "0.4"
tokio-test = "0.4"
tempfile = "3.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"

# ============================================================================
# Build Profiles
# ============================================================================

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
