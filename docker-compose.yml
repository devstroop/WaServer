services:
  was:
    build: .
    container_name: was
    ports:
      - "3000:3000"
    environment:
      - WAS_HOST=0.0.0.0
      - WAS_PORT=3000
      - WAS__AUTH__SECRET_KEY=${WAS__AUTH__SECRET_KEY:-your-secure-secret}
      - RUST_LOG=info
    volumes:
      # Persist browser session data
      - was-data:/app/data
      # Optional: mount custom config
      # - ./config/app.toml:/app/config/app.toml:ro
    restart: unless-stopped
    # Required for Chrome to work in container
    security_opt:
      - seccomp=unconfined
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  was-data:
